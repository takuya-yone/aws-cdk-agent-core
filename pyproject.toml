[project]
name = "aws-cdk-agent-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.35.0",
    "aws-opentelemetry-distro>=0.20.0",
    "bedrock-agentcore>=1.23.1",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "geopy>=2.5.0",
    "nanoid>=2.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pynamodb>=6.1.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sse-starlette>=3.4.11",
    "strands-agents>=1.57.0",
    "strands-agents-tools>=0.8.9",
    "tavily>=1.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src/agent"]

[tool.ruff]
target-version = "py314"

lint.ignore = [
    "E501",  # line too long
]

lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "N",  # pep8-naming
]
