[project]
name = "aws-cdk-agent-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.40.0",
    "aws-opentelemetry-distro>=0.22.0",
    "bedrock-agentcore>=1.25.4",
    "fastapi>=0.162.2",
    "feedparser>=6.0.14",
    "geopy>=2.5.0",
    "nanoid>=2.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pynamodb>=6.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sse-starlette>=3.7.0",
    "strands-agents>=1.64.0",
    "strands-agents-tools>=0.9.0",
    "tavily>=1.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["src/sandbox_agent"]

[tool.ruff]
target-version = "py314"

lint.ignore = [
    "E501",  # line too long
    "F403",  # star import
]

lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "N",  # pep8-naming
]
